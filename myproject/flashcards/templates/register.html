{% extends "base.html" %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 bg-black text-light d-flex flex-column justify-content-center align-items-center position-relative overflow-hidden p-5 shadow-lg">
        <h2 class="mb-4 text-center" style="color: #FFFFFF;">Welcome to FlashFlicks, your favorite studying space.</h2>
        <img src="{% static 'images/thunder.gif' %}" alt="Thunder Animation" class="img-fluid mb-4" style="width: 280px; height: auto;" />
    </div>
    <div class="col-md-6 bg-white text-dark d-flex flex-column justify-content-center align-items-center position-relative overflow-hidden p-5 shadow-lg">
        <h2 class="text-center mb-4">Register</h2>
        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email" class="form-label1">Email:</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Please enter your email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label1">Password:</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Please enter your password" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label1">Password:</label>
                <input type="password" id="confirm" name="confirm" class="form-control" placeholder="Please Confirm your password" required>
            </div>
            
            <button type="submit" class="btn btn-dark w-100 mb-3">Sign up</button>
            <a href="{% url 'login' %}" class="btn btn-outline-dark w-100">Go Back</a>
        </form>
    </div>
</div>
{% endblock %}
