{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FlashFlicks{% endblock %}</title>

    <!-- Favicons -->
    <link href="{% static 'img/favicon.png' %}" rel="icon">
    <link href="{% static 'img/apple-touch-icon.png' %}" rel="apple-touch-icon">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/aos/aos.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">

    <!-- Main CSS Files -->
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- In your base.html or the specific template -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_css %}
    <style>
        /* Timer Widget for Flashcard & Study Page */
        .timer-widget {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #002855;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }
    </style>
    {% endblock %}
</head>

<body class="index-page">

    <!-- Navbar -->
    {% include 'partials/navbar.html' %}

    <!-- Timer Widget (Only for Flashcard & Study Page) -->
    <div id="timerWidget" class="timer-widget"></div>

    <!-- Page Content -->
    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'partials/footer.html' %}

    <!-- Vendor JS Files -->
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/aos/aos.js' %}"></script>
    <script src="{% static 'vendor/glightbox/js/glightbox.min.js' %}"></script>
    <script src="{% static 'vendor/swiper/swiper-bundle.min.js' %}"></script>

    <!-- Main JS File -->
    <script src="{% static 'js/main.js' %}"></script>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=2">

    {% block extra_js %}
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            checkIfOnTimerPage();
        });

        function checkIfOnTimerPage() {
            const currentPath = window.location.pathname;

            // Check if page is 'studypage' or 'flashcards/<int:set_id>/'
            if (currentPath.includes('/studypage/') || currentPath.match(/^\/flashcards\/\d+\/$/)) {
                startCountdownTimer();
            }
        }

        function startCountdownTimer() {
            const savedSettings = JSON.parse(localStorage.getItem("studySettings"));
            
            if (savedSettings && savedSettings.timer !== "none") {
                let remainingTime = parseInt(savedSettings.remainingTime) || (parseInt(savedSettings.timer) * 60); // Convert minutes to seconds
                const timerWidget = document.getElementById("timerWidget");
                
                if (!timerWidget) return; // Avoid errors if widget is missing

                // Display Timer
                timerWidget.style.display = "block";
                updateTimerDisplay(remainingTime);

                // Start Countdown
                const countdownInterval = setInterval(() => {
                    remainingTime--;
                    localStorage.setItem("studySettings", JSON.stringify({ ...savedSettings, remainingTime }));

                    updateTimerDisplay(remainingTime);

                    if (remainingTime <= 0) {
                        clearInterval(countdownInterval);
                        timerWidget.textContent = "✅ Timer Completed!";
                        setTimeout(() => {
                            timerWidget.style.display = "none";
                        }, 5000); // Hide after 5 seconds
                    }
                }, 1000); // Update every second
            }
        }

        function updateTimerDisplay(seconds) {
            const timerWidget = document.getElementById("timerWidget");
            if (!timerWidget) return;

            let minutes = Math.floor(seconds / 60);
            let sec = seconds % 60;
            timerWidget.textContent = `⏳ ${minutes}:${sec < 10 ? "0" : ""}${sec} remaining`;
        }
    </script>
    {% endblock %}

</body>
</html>
